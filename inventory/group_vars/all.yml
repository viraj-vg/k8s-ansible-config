---
# node-setup
node_setup_kernel_modules:
  - br_netfilter
  - overlay
node_setup_kernel_parameters:
  - name: net.ipv4.ip_forward
    value: "1"
  - name: net.bridge.bridge-nf-call-iptables
    value: "1"
  - name: net.bridge.bridge-nf-call-ip6tables
    value: "1"

# node-exporter (turn OFF the chart's own node-exporter in the Helm values)
node_exporter_version: "1.8.2"
node_exporter_port: 9100
node_exporter_listen_address: "0.0.0.0"
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64

# monitoring roles (run on the control machine, apply to the cluster with kubectl)
monitoring_namespace: monitoring
monitoring_apply_to_cluster: false      # set true (-e) once the monitoring stack exists
prometheus_release_label: kube-prometheus-stack   # must match your Helm release name
rendered_dir: "{{ playbook_dir }}/../rendered"

# Alertmanager: real value goes in Ansible Vault, never in Git
alertmanager_slack_channel: "#alerts"
alertmanager_resolve_timeout: 5m
alertmanager_slack_webhook_url: !vault |
