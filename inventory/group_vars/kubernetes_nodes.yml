---
# Workers are in private subnets with no SSH key: connect through AWS SSM.
# Needs: session-manager-plugin on this machine, and a bucket for file transfer.
#   export ANSIBLE_SSM_BUCKET=<your existing S3 bucket>
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: ap-south-1
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSM_BUCKET') }}"
ansible_python_interpreter: /usr/bin/python3
